name: Tipness connection diagnosis

on:
  push:
    paths:
      - .github/workflows/connectivity-check.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic tools
        run: |
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Compare public login page access
        run: |
          python - <<'PY'
          import json, os
          import requests
          from playwright.sync_api import sync_playwright
          url = "https://i.tipness.co.jp/i/auth/login"
          results = []
          try:
              r = requests.get(url, timeout=(15, 45), headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36",
                  "Accept-Language": "ja,en-US;q=0.9,en;q=0.8"})
              results.append({"client": "requests", "http": r.status_code,
                              "login_form": 'name="login_pass"' in r.text,
                              "security_block": "セキュリティ機能によりページの表示がブロック" in r.text})
          except requests.RequestException as e:
              results.append({"client": "requests", "error_type": type(e).__name__})
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              try:
                  r = page.goto(url, wait_until="domcontentloaded", timeout=60000)
                  results.append({"client": "chromium", "http": r.status if r else None,
                                  "login_form": page.locator('input[name="login_pass"]').count() > 0,
                                  "security_block": "セキュリティ機能によりページの表示がブロック" in page.content()})
              except Exception as e:
                  results.append({"client": "chromium", "error_type": type(e).__name__})
              finally:
                  browser.close()
          print(json.dumps(results, ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Public login connectivity (no credentials submitted)\n\n")
              f.write("```json\n" + json.dumps(results, indent=2, ensure_ascii=False) + "\n```\n")
          PY
